<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Digital Slam Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #333;
        }

        nav {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .toggle-btn:hover {
            background: white;
            color: #764ba2;
            transform: translateY(-2px);
        }

        /* 3D Container */
        .container {
            perspective: 1000px; /* Required for 3D effect */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        /* The Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 
                        inset 0 0 0 1px rgba(255,255,255,0.5);
            transform-style: preserve-3d; /* Keeps child elements in 3D space */
            transition: transform 0.1s ease-out;
        }

        /* Floating elements inside the 3D card */
        .card-content {
            transform: translateZ(40px); /* Pushes content out towards the user */
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4a4a4a;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
            background: #fff;
        }

        button.submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
            transform: translateZ(20px);
        }

        button.submit-btn:hover {
            transform: translateZ(20px) translateY(-3px);
            box-shadow: 0 15px 25px rgba(118, 75, 162, 0.4);
        }

        /* Admin Page Styles */
        .admin-page {
            display: none;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .admin-page h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .entries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .entry-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            position: relative;
        }

        .entry-card:hover {
            transform: translateY(-5px);
        }

        .entry-card h3 {
            color: #764ba2;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .entry-detail {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .entry-detail span {
            font-weight: 600;
            color: #555;
        }
        
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <nav>
        <button class="toggle-btn" id="toggleViewBtn" onclick="toggleView()">Go to Admin Page</button>
    </nav>

    <!-- USER FORM PAGE (3D) -->
    <main class="container" id="userView">
        <div class="card" id="tiltCard">
            <div class="card-content">
                <h2>✨ My Slam Book ✨</h2>
                <form id="slamForm">
                    <div class="input-group">
                        <label>Your Name</label>
                        <input type="text" id="name" required placeholder="Enter your full name">
                    </div>
                    <div class="input-group">
                        <label>Nickname for me</label>
                        <input type="text" id="nickname" required placeholder="What do you call me?">
                    </div>
                    <div class="input-group">
                        <label>Best memory together</label>
                        <textarea id="memory" rows="3" required placeholder="Share a funny or sweet memory..."></textarea>
                    </div>
                    <div class="input-group">
                        <label>Describe me in one word</label>
                        <input type="text" id="word" required placeholder="e.g., Hilarious, Loyal, etc.">
                    </div>
                    <button type="submit" class="submit-btn">Submit Answers 🚀</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ADMIN DASHBOARD PAGE -->
    <div class="admin-page" id="adminView">
        <h1>Admin Dashboard 🔒</h1>
        <div class="entries-grid" id="entriesGrid">
            <!-- Entries will be injected here via JavaScript -->
        </div>
    </div>

    <script>
        // --- 1. 3D Tilt Effect Logic ---
        const card = document.getElementById('tiltCard');
        const container = document.getElementById('userView');

        // Move Animation Event
        container.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Animate In (Reset smoothly when mouse leaves)
        container.addEventListener('mouseenter', (e) => {
            card.style.transition = 'none';
        });

        // Animate Out
        container.addEventListener('mouseleave', (e) => {
            card.style.transition = 'transform 0.5s ease';
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });


        // --- 2. Database / LocalStorage Logic ---
        const form = document.getElementById('slamForm');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page reload

            // Get data from form
            const newEntry = {
                id: Date.now(),
                name: document.getElementById('name').value,
                nickname: document.getElementById('nickname').value,
                memory: document.getElementById('memory').value,
                word: document.getElementById('word').value,
                date: new Date().toLocaleDateString()
            };

            // Fetch existing entries from LocalStorage, or create empty array
            let entries = JSON.parse(localStorage.getItem('slamEntries')) || [];
            
            // Add new entry
            entries.push(newEntry);
            
            // Save back to LocalStorage
            localStorage.setItem('slamEntries', JSON.stringify(entries));

            alert('Thank you! Your answers have been submitted successfully. 🎉');
            form.reset(); // Clear form
            loadAdminEntries(); // Refresh admin page behind the scenes
        });


        // --- 3. View Toggling (User <-> Admin) ---
        let isAdminView = false;
        
        function toggleView() {
            const userView = document.getElementById('userView');
            const adminView = document.getElementById('adminView');
            const toggleBtn = document.getElementById('toggleViewBtn');

            isAdminView = !isAdminView;

            if(isAdminView) {
                userView.style.display = 'none';
                adminView.style.display = 'block';
                toggleBtn.innerText = 'Go to User Page';
                loadAdminEntries(); // Load data when opening admin
            } else {
                userView.style.display = 'flex';
                adminView.style.display = 'none';
                toggleBtn.innerText = 'Go to Admin Page';
            }
        }


        // --- 4. Admin Dashboard Rendering ---
        function loadAdminEntries() {
            const grid = document.getElementById('entriesGrid');
            grid.innerHTML = ''; // Clear current grid

            let entries = JSON.parse(localStorage.getItem('slamEntries')) || [];

            if(entries.length === 0) {
                grid.innerHTML = '<h3 style="color:white; text-align:center; width:100%;">No entries yet! Share your link with friends.</h3>';
                return;
            }

            // Loop through entries and create HTML cards
            entries.reverse().forEach(entry => {
                const cardHTML = `
                    <div class="entry-card">
                        <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                        <h3>${entry.name}</h3>
                        <div class="entry-detail"><span>Date:</span> ${entry.date}</div>
                        <div class="entry-detail"><span>Nickname for you:</span> ${entry.nickname}</div>
                        <div class="entry-detail"><span>Describes you as:</span> ${entry.word}</div>
                        <div class="entry-detail"><span>Best Memory:</span> <br> ${entry.memory}</div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function deleteEntry(id) {
            if(confirm("Are you sure you want to delete this entry?")) {
                let entries = JSON.parse(localStorage.getItem('slamEntries')) || [];
                entries = entries.filter(entry => entry.id !== id);
                localStorage.setItem('slamEntries', JSON.stringify(entries));
                loadAdminEntries(); // Refresh UI
            }
        }
    </script>
</body>
</html>
