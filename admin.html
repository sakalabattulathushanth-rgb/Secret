<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slam Book Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #f4f7f6;
            color: #333;
            padding: 40px 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { color: #11998e; font-size: 32px; }
        .back-link {
            background: white; padding: 10px 20px; border-radius: 30px; 
            text-decoration: none; color: #333; font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .back-link:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            position: relative;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .card h2 { color: #222; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; font-size: 22px;}
        .date { font-size: 12px; color: #888; position: absolute; top: 25px; right: 25px; }
        
        .qa { margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
        .qa strong { display: block; color: #11998e; font-size: 13px; margin-bottom: 2px; }
        .qa span { color: #555; }

        .delete-btn {
            width: 100%; background: #ff4757; color: white; border: none; padding: 10px;
            border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .delete-btn:hover { background: #ff2a3d; }

        .empty-state { text-align: center; color: #888; grid-column: 1 / -1; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin Dashboard 🔒</h1>
        <a href="index.html" class="back-link">Go to Slam Book</a>
    </div>

    <div class="grid" id="entriesGrid">
        <!-- Cards will load here -->
    </div>

    <script>
        function loadEntries() {
            const grid = document.getElementById('entriesGrid');
            grid.innerHTML = ''; 

            let entries = JSON.parse(localStorage.getItem('slamData2024')) || [];

            if (entries.length === 0) {
                grid.innerHTML = '<div class="empty-state">No entries yet! Send your index.html to friends.</div>';
                return;
            }

            entries.reverse().forEach(entry => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="date">${entry.date}</div>
                    <h2>${entry.q1}</h2>
                    <div class="qa"><strong>Nickname:</strong> <span>${entry.q2}</span></div>
                    <div class="qa"><strong>Colour that suits me:</strong> <span>${entry.q3}</span></div>
                    <div class="qa"><strong>One Word:</strong> <span>${entry.q4}</span></div>
                    <div class="qa"><strong>Best Memory:</strong> <span>${entry.q5}</span></div>
                    <div class="qa"><strong>First Impression:</strong> <span>${entry.q6}</span></div>
                    <div class="qa"><strong>Best Quality:</strong> <span>${entry.q7}</span></div>
                    <div class="qa"><strong>Annoying Habit:</strong> <span>${entry.q8}</span></div>
                    <div class="qa"><strong>Movie Genre:</strong> <span>${entry.q9}</span></div>
                    <div class="qa"><strong>Future Message:</strong> <span>${entry.q10}</span></div>
                    
                    <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete Entry</button>
                `;
                grid.appendChild(card);
            });
        }

        function deleteEntry(id) {
            if (confirm("Are you sure you want to delete this submission?")) {
                let entries = JSON.parse(localStorage.getItem('slamData2024')) || [];
                entries = entries.filter(entry => entry.id !== id);
                localStorage.setItem('slamData2024', JSON.stringify(entries));
                loadEntries(); 
            }
        }

        window.onload = loadEntries;
    </script>
</body>
</html>
